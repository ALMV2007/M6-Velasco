<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Settings</title>

  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Settings</h1>

    <label for="visitor-name">Your name</label>
    <input type="text" id="visitor-name">

    <button id="theme-toggle" type="button">
      Change theme
    </button>

    <button id="save-settings" type="button">
      Save settings
    </button>

    <p id="last-visit"></p>
  </main>
</body>
</html>
